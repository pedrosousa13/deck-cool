name: Drawer bench

# Runs the interleaved drawer bench (#266, #233/#245) on six parallel,
# dedicated ubuntu-latest shards, never on a shared machine: each shard runs
# every scenario, load and deck itself, in a freshly shuffled order per
# (scenario, load, rep) (decks/drawerdeck/bench/bench.spec.ts), so no
# library's reps land disproportionately on a busier or quieter stretch of
# a shard's own run. `report` pools every shard's rows into medians, spread
# and n per cell, plus a per-shard winner table, and uploads both as an
# artifact -- never to this repo's working tree, since this workflow has no
# write permission and no secret. `report` then gates drawerdeck's public
# comparison-page claims (#276, decks/drawerdeck/bench/claims.json) against
# this same pooled run, and fails the job if one broke.
on:
  pull_request:
    paths:
      - "decks/drawerdeck/packages/core/**"
      - "decks/drawerdeck/packages/react/**"
      - "decks/drawerdeck/bench/**"
      - ".github/workflows/drawer-bench.yml"
  push:
    branches: [main]
    paths:
      - "decks/drawerdeck/packages/core/**"
      - "decks/drawerdeck/packages/react/**"
      - "decks/drawerdeck/bench/**"
      - ".github/workflows/drawer-bench.yml"
  workflow_dispatch:
    inputs:
      reps_per_shard:
        description: "Reps per (scenario, load, deck) cell, per shard."
        required: false
        default: "5"
        type: string
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday

# One run at a time per ref: a second push to the same pull request cancels
# the one already running (the numbers from an abandoned commit are moot);
# a push to main never cancels another push to main, so a run there always
# finishes and uploads its own artifact.
concurrency:
  group: drawer-bench-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The rep count every published run, and claims.json's own claims, are
  # judged against (#276). A workflow_dispatch with a different count is a
  # different statistic -- report's own "Skip the gate..." step below
  # skips the gate rather than comparing it against claims it was never
  # meant to be judged against.
  PUBLISHED_REPS_PER_SHARD: "5"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Puts the pnpm named in package.json's packageManager on the path.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @drawerdeck/react is a workspace:* dependency of the bench (#266):
      # building it here, from this run's own checkout, is what makes the
      # bench always measure the commit under test, not a packed tarball
      # from some other checkout.
      - run: pnpm --dir decks/drawerdeck build
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --dir decks/drawerdeck/bench build

      - name: Record the runner, before
        run: |
          mkdir -p decks/drawerdeck/bench/results
          {
            echo "shard: ${{ matrix.shard }}"
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "nproc: $(nproc)"
            echo
            echo "lscpu:"
            lscpu
            echo
            echo "uptime, before:"
            uptime
          } > decks/drawerdeck/bench/results/machine.txt

      - name: Run the interleaved bench
        working-directory: decks/drawerdeck/bench
        env:
          SHARD_ID: shard-${{ matrix.shard }}
          BENCH_SEED: run-${{ github.run_id }}-shard-${{ matrix.shard }}
          BENCH_REPS: ${{ inputs.reps_per_shard || env.PUBLISHED_REPS_PER_SHARD }}
        run: pnpm exec playwright test -c playwright.config.ts bench.spec.ts

      - name: Record the runner, after
        run: |
          {
            echo
            echo "uptime, after:"
            uptime
          } >> decks/drawerdeck/bench/results/machine.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drawer-bench-shard-${{ matrix.shard }}
          path: decks/drawerdeck/bench/results/
          if-no-files-found: error

  report:
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Built once, for bundle-size.mjs: it is a Vite build, not a browser
      # run, and the figure is the same on every shard, so it is measured
      # here instead of six times over.
      - run: pnpm --dir decks/drawerdeck build
      - name: Measure bundle size
        working-directory: decks/drawerdeck/bench
        run: |
          node bundle-size.mjs | tee bundle-size.txt
          grep '^JSON:' bundle-size.txt | sed 's/^JSON: //' > bundle-size.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: drawer-bench-shard-*
          path: shards

      - name: Aggregate every shard
        run: |
          mkdir -p report-out
          python3 decks/drawerdeck/bench/aggregate.py shards \
            --bundle decks/drawerdeck/bench/bundle-size.json \
            --out-md report-out/RESULTS.md \
            --out-jsonl report-out/aggregate.jsonl \
            --out-summary report-out/summary.md
          cat report-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      # The gate's own unit tests, against synthetic rows (#276's review):
      # proves drawerdeck_verdict/cell_winner and the gate's evaluate()
      # still behave before trusting either against this run's real
      # numbers below.
      - name: Test the bench's own aggregation and claims gate
        working-directory: decks/drawerdeck/bench
        run: |
          python3 aggregate_test.py
          python3 claims_gate_test.py

      - name: Skip the gate for a non-published rep count
        if: github.event_name == 'workflow_dispatch' && inputs.reps_per_shard != env.PUBLISHED_REPS_PER_SHARD
        run: |
          echo "::notice::Skipping the claims gate: this dispatch used reps_per_shard=${{ inputs.reps_per_shard }}, not the published ${{ env.PUBLISHED_REPS_PER_SHARD }} every claim in claims.json is judged against, so a pass or a fail here would not mean what it means on a published run."

      # Gates drawerdeck's own public comparison-page claims (#276,
      # decks/drawerdeck/bench/claims.json) against this same pooled run,
      # re-deriving each claimed cell's own verdict with aggregate.py's
      # own drawerdeck_verdict/excluded_decks (claims_gate.py imports them;
      # no second win/tie/loss rule here). Skipped on a workflow_dispatch
      # using a non-published rep count (see the notice above).
      # `continue-on-error` so the verdict still reaches the job summary
      # and the artifact below even when a claim breaks; "Fail if a claim
      # broke" turns that into the job's own failure, after both are
      # written.
      - name: Gate drawerdeck's comparison-page claims (#276)
        id: gate
        if: github.event_name != 'workflow_dispatch' || inputs.reps_per_shard == env.PUBLISHED_REPS_PER_SHARD
        continue-on-error: true
        run: |
          python3 decks/drawerdeck/bench/claims_gate.py report-out/aggregate.jsonl \
            --bundle decks/drawerdeck/bench/bundle-size.json \
            --claims decks/drawerdeck/bench/claims.json \
            --out-md report-out/claims-gate.md \
            --out-json report-out/claims-gate.json

      # `|| true`: this must never fail the job on its own, even if the
      # gate step above crashed before writing claims-gate.md (or was
      # skipped) -- RESULTS.md/aggregate.jsonl/summary.md, already on
      # disk from the aggregate step, must still reach the artifact below.
      - name: Put the claims gate's verdict on the job summary
        if: always()
        run: cat report-out/claims-gate.md >> "$GITHUB_STEP_SUMMARY" || true

      # if: always(), for the same reason: a crash or a skip in the gate
      # step must not cost this run its own RESULTS.md/aggregate.jsonl.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: drawer-bench-report
          path: report-out/
          if-no-files-found: error

      - name: Fail if a claim broke
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::drawerdeck's comparison-page claims gate (#276) failed; see the job summary above, or claims-gate.md in the drawer-bench-report artifact, for which claim(s) broke."
          exit 1
