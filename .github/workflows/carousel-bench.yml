name: Carousel bench

# Runs the interleaved carousel bench (#340, ported from drawer-bench.yml,
# #266/#233/#245) on dedicated ubuntu-latest shards, never on a shared
# machine: the `bench` job shards the five gesture scenarios (touch swipe,
# touch flick, mouse drag, wheel scroll, next button), each at three
# main-thread loads and both loop variants, across every deck
# (decks/carouseldeck/bench/bench.spec.ts); the `mount-bench` job shards the
# mount scenario (2 and 20 instances, clean and dirty-sibling, hydrated and
# client-rendered) separately, since it needs the bench's SSR build and
# scores a different trace window (decks/carouseldeck/bench/mount.spec.ts).
# `report` pools every shard's rows into medians, spread and n per cell,
# plus a per-shard winner table for the gesture scenarios, and uploads both
# reports as artifacts -- never to this repo's working tree, since this
# workflow has no write permission and no secret.
on:
  workflow_dispatch:
    inputs:
      reps_per_shard:
        description: "Gesture-scenario reps per (scenario, load, loop, deck) cell, per shard."
        required: false
        default: "3"
        type: string
      mount_reps_per_shard:
        description: "Mount-scenario reps per (deck, n, dirty, mode) cell, per shard."
        required: false
        default: "3"
        type: string
  schedule:
    - cron: "41 6 * * 1" # weekly, Monday (offset from drawer-bench.yml's 6:17 so they don't contend for runners)

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Puts the pnpm named in package.json's packageManager on the path.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @carouseldeck/react is a workspace:* dependency of the bench (the
      # same convention #266 set for drawerdeck's bench): building it here,
      # from this run's own checkout, is what makes the bench always
      # measure the commit under test, not a packed tarball from some other
      # checkout.
      - run: pnpm --dir decks/carouseldeck/packages/core build
      - run: pnpm --dir decks/carouseldeck/packages/react build
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --dir decks/carouseldeck/bench build

      - name: Record the runner, before
        run: |
          mkdir -p decks/carouseldeck/bench/results
          {
            echo "shard: ${{ matrix.shard }}"
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "nproc: $(nproc)"
            echo
            echo "lscpu:"
            lscpu
            echo
            echo "uptime, before:"
            uptime
          } > decks/carouseldeck/bench/results/machine.txt

      - name: Run the interleaved gesture bench
        working-directory: decks/carouseldeck/bench
        env:
          SHARD_ID: shard-${{ matrix.shard }}
          BENCH_SEED: run-${{ github.run_id }}-shard-${{ matrix.shard }}
          BENCH_REPS: ${{ inputs.reps_per_shard || 3 }}
        run: pnpm exec playwright test -c playwright.config.ts bench.spec.ts

      - name: Record the runner, after
        run: |
          {
            echo
            echo "uptime, after:"
            uptime
          } >> decks/carouseldeck/bench/results/machine.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carousel-bench-shard-${{ matrix.shard }}
          path: decks/carouseldeck/bench/results/
          if-no-files-found: error

  mount-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir decks/carouseldeck/packages/core build
      - run: pnpm --dir decks/carouseldeck/packages/react build
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm --dir decks/carouseldeck/bench build

      - name: Record the runner, before
        run: |
          mkdir -p decks/carouseldeck/bench/results
          {
            echo "shard: ${{ matrix.shard }}"
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "nproc: $(nproc)"
          } > decks/carouseldeck/bench/results/machine.txt

      - name: Run the interleaved mount bench
        working-directory: decks/carouseldeck/bench
        env:
          SHARD_ID: shard-${{ matrix.shard }}
          BENCH_SEED: run-${{ github.run_id }}-mount-shard-${{ matrix.shard }}
          MOUNT_REPS: ${{ inputs.mount_reps_per_shard || 3 }}
        run: pnpm exec playwright test -c playwright.config.ts mount.spec.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carousel-mount-bench-shard-${{ matrix.shard }}
          path: decks/carouseldeck/bench/results/
          if-no-files-found: error

  report:
    needs: [bench, mount-bench]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: carousel-bench-shard-*
          path: shards

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: carousel-mount-bench-shard-*
          path: mount-shards

      - name: Aggregate every gesture shard
        run: |
          mkdir -p report-out
          python3 decks/carouseldeck/bench/aggregate.py shards \
            --out-md report-out/RESULTS.md \
            --out-jsonl report-out/aggregate.jsonl \
            --out-summary report-out/summary.md
          cat report-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Aggregate every mount shard
        run: |
          python3 decks/carouseldeck/bench/aggregate-mount.py mount-shards \
            --out-md report-out/MOUNT-RESULTS.md \
            --out-jsonl report-out/mount-aggregate.jsonl \
            --out-summary report-out/mount-summary.md
          cat report-out/mount-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carousel-bench-report
          path: report-out/
          if-no-files-found: error
