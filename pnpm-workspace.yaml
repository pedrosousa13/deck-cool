packages:
  - sites/*
  - packages/*
  # The docs loader's fixture docs package, linked into @deck-cool/docs.
  - packages/docs/fixtures/example-docs
  # carouseldeck, an in-repo deck (ADR 0002): its root package, for its scripts
  # and dev dependencies, and its old workspace's members. tests/next-rsc
  # stays outside, with its own lockfile.
  - decks/carouseldeck
  - decks/carouseldeck/packages/*
  - decks/carouseldeck/apps/*
  - decks/carouseldeck/tests/compare
  - decks/carouseldeck/prototypes/scroll-snap
  - decks/carouseldeck/prototypes/drawer-bench
# wrangler deploy runs without esbuild's and workerd's install scripts: the
# Worker has no code to bundle or run, only static assets.
allowBuilds:
  esbuild: false
  workerd: false
# The maintainer published @playdeck/docs@1.3.0 and @pagedeck/docs@0.2.3 by
# hand on 2026-10-11, each from its deck's own main, so these versions skip
# pnpm's one-day hold (#52, #53). #93 removes these entries once the hold has
# passed.
minimumReleaseAgeExclude:
  - '@playdeck/docs@1.3.0'
  - '@pagedeck/docs@0.2.3'
# satori pins fflate 0.7.3, which GHSA-px8p-9vwx-vf98 covers. Remove this
# override once satori stops pinning 0.7.3.
# @drawerdeck/react's packed tarball (#245) declares a plain "0.0.0"
# dependency on @drawerdeck/core, which npm does not have (drawerdeck is
# unreleased): without this, pnpm 404s trying to fetch it. This branch has
# no decks/drawerdeck workspace member to conflict with, so the override
# is safe here; remove it if that ever changes.
overrides:
  fflate: 0.7.5
  '@drawerdeck/core': 'file:decks/carouseldeck/prototypes/drawer-bench/.pack/drawerdeck-core-0.0.0.tgz'
